<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Portfolio social preview source</title>
    <style>
      * { box-sizing: border-box; }
      body { width: 1200px; height: 630px; margin: 0; background: #f4f4f7; color: #24232b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { position: relative; width: 1152px; height: 582px; margin: 24px; padding: 48px 54px; border-radius: 24px; background: white; }
      .name { margin: 0; font-size: 23px; font-weight: 700; letter-spacing: -.7px; }
      .name span, h1 span { color: #6750cf; }
      .copy { position: relative; z-index: 1; width: 575px; }
      .eyebrow { margin: 53px 0 18px; color: #6750cf; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
      h1 { margin: 0; font-size: 61px; line-height: 1.1; letter-spacing: -3.3px; }
      .role { margin: 25px 0 0; font-size: 21px; line-height: 1.5; }
      .stack { margin: 19px 0 0; color: #62616e; font-size: 15px; }
      .url { margin: 30px 0 0; color: #62616e; font-size: 13px; }
      img { position: absolute; right: 30px; top: 60px; width: 485px; height: 485px; }
    </style>
  </head>
  <body>
    <main>
      <p class="name">Arun Kumar Ganesan<span>.</span></p>
      <div class="copy">
        <p class="eyebrow">IDEAS INTO WORKING SOFTWARE</p>
        <h1>Love to turn ideas<br />into <span>reality.</span></h1>
        <p class="role">Software Engineer &amp;<br />Full-stack Python Developer</p>
        <p class="stack">Python · Django · React · AWS · Linux</p>
        <p class="url">ganesanarunkumar.github.io</p>
      </div>
      <img src="ideas-to-software-hero.jpg" width="1254" height="1254" alt="An idea and code connect to a working software system." />
    </main>
  </body>
</html>
